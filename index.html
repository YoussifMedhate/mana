<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>رسالة لـ Mana 💛</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0; min-height: 100vh; padding: 28px 16px;
  display: grid; place-items: center; font-family: Tahoma, Arial, sans-serif;
  background: radial-gradient(circle at top, #fff2da, #fbe5ef 60%, #eae3ff);
  color: #493447;
}
main {
  width: min(100%, 540px); padding: 36px 24px; text-align: center;
  background: #ffffffde; border: 1px solid white; border-radius: 30px;
  box-shadow: 0 20px 70px #774b7820;
}
.badge { font-size: 13px; letter-spacing: 2px; color: #98627f; }
.lamp { font-size: 64px; margin: 20px 0; }
h1 { font-size: clamp(26px, 6vw, 38px); margin: 12px 0; }
p { line-height: 1.95; font-size: 18px; }
button {
  border: 0; border-radius: 18px; padding: 16px 24px; cursor: pointer;
  background: #845574; color: white; font: inherit; margin: 12px 0;
}
button:hover { background: #69435d; }
button:focus-visible { outline: 3px solid #d59e36; outline-offset: 4px; }
#letter { margin-top: 24px; text-align: right; }
#letter > :not(.short-message) { display: none; }
.note { font-size: 14px; color: #80677b; }
.star { position: fixed; pointer-events: none; animation: float 2s ease-out forwards; }
@keyframes float {
  from { transform: translateY(0) rotate(0); opacity: 1; }
  to { transform: translateY(-180px) rotate(35deg); opacity: 0; }
}
@media (prefers-reduced-motion: reduce) { .star { animation: none; } }
</style>
</head>
<body>
<main>
  <div class="badge" dir="ltr">A LITTLE LIGHT FOR MANA</div>
  <div class="lamp" aria-hidden="true">🏮</div>
  <h1>منار… مش حد تاني جنى هند .... الخ💛</h1>
  <p>يا Mana، دي رسالة صلح معمولة عشانك،<br> متزعليش </p>
  <button id="open" type="button" aria-expanded="false" aria-controls="letter">افتحي رسالتك </button>
<section id="letter" hidden>
    <p class="short-message">متزعليش يا شطورة</p>
    <p class="short-message" >Don't be sad, champ</p>
    <p class="short-message">Matza3lesh ya shatoura</p>
    <p class="short-message">Don't be sad ya shatoura</p>
</section>
</main>
<script>
const button = document.getElementById('open');
button.addEventListener('click', () => {
  document.getElementById('letter').hidden = false;
  button.setAttribute('aria-expanded', 'true');
  button.textContent = 'منا خلاص مش زعلانة';
  button.disabled = true;
  if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  for (let i = 0; i < 18; i++) {
    const star = document.createElement('span');
    star.className = 'star';
    star.textContent = ['💛', '✨', '🌷'][i % 3];
    star.setAttribute('aria-hidden', 'true');
    star.style.left = `${Math.random() * 90 + 5}%`;
    star.style.top = `${Math.random() * 35 + 50}%`;
    star.style.fontSize = `${Math.random() * 14 + 18}px`;
    document.body.appendChild(star);
    setTimeout(() => star.remove(), 2100);
  }
});
</script>
</body>
</html>
